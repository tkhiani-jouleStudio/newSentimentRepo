apiVersion: asset.sap/v1
kind: Asset
type: agent

metadata:
  name: feedback-sentiment-agent
  version: 1.0.0

provides:
  apis:
    - name: feedback-sentiment-agent
      kind: a2a
      ordId: customer.build:apiResource:feedback-sentiment-agent-2e242.feedback-sentiment-agent:v1
      description: AI agent that classifies customer feedback sentiment and generates summaries.

container:
  buildPath: .
  port: 5000

probes:
  startup:
    path: /.well-known/agent.json
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 18
  liveness:
    path: /.well-known/agent.json
    initialDelaySeconds: 15
    periodSeconds: 10
    timeoutSeconds: 5
    failureThreshold: 3
  readiness:
    path: /.well-known/agent.json
    initialDelaySeconds: 5
    periodSeconds: 5
    timeoutSeconds: 3
    failureThreshold: 3
